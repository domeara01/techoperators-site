<style>
  :root {

  }
  :root[data-theme="light"] {
    --ground: #F2F7F4; --ground-2: #E8F0EB; --ink: #112E23; --ink-2: #2E4A3F; --muted: #5F7072;
    --surface: #FFFFFF; --surface-2: #F3F8F5; --field: #FFFFFF; --line: rgba(17, 46, 35, 0.12); --line-strong: rgba(17, 46, 35, 0.28);

  @media (max-width: 480px) { .wrap { padding-inline: 16px; } .top-in { padding-inline: 16px; } }

  /* ---------- pills, chips, buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid transparent; cursor: pointer; background: transparent; white-space: nowrap; }

  .btn.cta:hover { filter: brightness(1.06); }
  .btn.cta:disabled { opacity: .55; cursor: not-allowed; filter: none; }
  .btn.ghost { border-color: var(--line-strong); color: var(--ink); }
  .btn.ghost:hover { background: var(--surface); }
  .btn.sm { height: 36px; padding: 0 14px; font-size: 13px; }

  .chip { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; background: var(--chip); font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }

  .pick button:hover { border-color: var(--line-strong); }

  .pick button:disabled { opacity: .4; cursor: not-allowed; }
  .status-pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .status-pill i { width: 8px; height: 8px; border-radius: 50%; }
  .status-pill.draft { background: var(--chip); color: var(--ink-2); } .status-pill.draft i { background: var(--muted); }
  .status-pill.submitted { background: var(--warn-soft); color: var(--ink); } .status-pill.submitted i { background: var(--warn); }
  .status-pill.live { background: var(--accent-soft); color: var(--ink); } .status-pill.live i { background: var(--accent); }
  .sample { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; border: 1px dashed var(--line-strong); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); vertical-align: middle; font-weight: 600; }

  .field input, .field textarea, .field select { width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--ink); font-size: 15px; outline: 0; }

  .demo .lbl-txt { color: var(--muted); }

  .mail { border: 1px solid var(--line-strong); border-radius: 16px; overflow: hidden; background: var(--ground-2); }

  /* ---------- editor ---------- */
  .ed-head { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .ed-head h1 { margin: 0; font-size: clamp(26px, 3.4vw, 34px); line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; }

  .banner.info { background: var(--surface); border: 1px dashed var(--line-strong); color: var(--ink-2); }

  .banner svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; align-items: start; }
  .form { display: grid; gap: 22px; }
  .section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; display: grid; gap: 18px; }
  .section h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.005em; display: flex; align-items: center; gap: 10px; }
  .section h2 .n { color: var(--muted); font-weight: 500; font-size: 13px; }
  .section .desc { margin: -8px 0 0; color: var(--muted); font-size: 13.5px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
  .photo-row { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; }
  .photo-row .ph { width: 96px; height: 96px; }
  .photo-row .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .photo-row .hint { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .ph { position: relative; width: 76px; height: 76px; flex: none; }
  .ph img, .ph .ini { width: 100%; height: 100%; border-radius: 26px 26px 26px 8px; object-fit: cover; display: block; }
  .ph .ini { display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line-strong); font-weight: 700; font-size: 22px; color: var(--ink-2); }
  .ph-lg img, .ph-lg .ini { border-radius: 32px 32px 32px 10px; }
  .dot { position: absolute; right: -3px; bottom: -3px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--field); cursor: pointer; }
  .switch .t { font-weight: 600; font-size: 14px; }
  .switch .d { color: var(--muted); font-size: 12.5px; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .sw { width: 40px; height: 24px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-strong); position: relative; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
  .switch input:checked + .sw { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .sw::after { transform: translateX(16px); background: var(--accent-ink); }
  .switch input:focus-visible + .sw { outline: 2px solid var(--focus); outline-offset: 2px; }
  .radios { display: flex; flex-wrap: wrap; gap: 8px; }
  .radios label { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 500; }
  .radios label:has(input:checked) { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); font-weight: 600; }
  .radios input { position: absolute; opacity: 0; width: 0; height: 0; }
  .radios label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .roles-ed { display: grid; gap: 10px; }
  .role { display: grid; grid-template-columns: 44px 1.2fr 1fr 1fr 72px 72px 116px 36px; gap: 10px; align-items: center; }
  .role-head { display: grid; grid-template-columns: 44px 1.2fr 1fr 1fr 72px 72px 116px 36px; gap: 10px; margin: 4px 0 -2px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .role-head span { padding-left: 12px; white-space: nowrap; overflow: hidden; }
  .role-head[hidden] { display: none; }
  .rf { display: block; min-width: 0; }
  .rf > span { display: none; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .rf.cur { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
  .rf.cur > span { display: inline; font-size: 12.5px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-2); margin: 0; }
  .rf.cur input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .role input:disabled { opacity: .55; }
  .role input.yrs { font-variant-numeric: tabular-nums; }
  .role .logo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 14px; border: 1px solid var(--line); overflow: hidden; }
  .logo.img { background: #fff; border-color: rgba(17, 46, 35, 0.12) !important; }
  .logo.img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .role input { width: 100%; min-width: 0; background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; outline: 0; }
  .role input:focus { border-color: var(--line-strong); }
  .role .rm { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: none; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
  .role .rm:hover { border-color: var(--line-strong); color: var(--ink); }
  .role .rm svg { width: 14px; height: 14px; }
  @media (max-width: 1240px) { .role-head { display: none; } .rf > span { display: block; } .role { grid-template-columns: 44px 1fr 1fr 1fr 36px; gap: 8px; align-items: end; } .rf.t { grid-column: 2 / 5; } .rf.c, .rf.w { grid-column: 2 / 6; } .rf.f { grid-column: 2 / 3; } .rf.to { grid-column: 3 / 4; } .rf.cur { grid-column: 4 / 6; align-self: end; padding-bottom: 12px; } .role .rm { grid-column: 5; grid-row: 1; align-self: end; } .role .logo { grid-row: 1 / 5; align-self: start; } .roles-ed { gap: 22px; } .roles-ed .role + .role { padding-top: 18px; border-top: 1px dashed var(--line); } }
  .logo-hint { font-size: 12.5px; color: var(--muted); }

  /* ---------- preview ---------- */
  .preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); display: grid; gap: 14px; align-content: start; max-height: calc(100vh - 190px); overflow-y: auto; padding: 2px 4px 2px 2px; scrollbar-width: thin; }
  .preview .lbl-txt { display: flex; justify-content: space-between; align-items: center; }
  .tile { display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
  .tile .name { font-weight: 700; font-size: 17px; line-height: 1.25; margin: 0; }
  .tile .hl { margin: 3px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .loc { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .tile .loc svg { width: 13px; height: 13px; }
  .tile .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pv-full { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 16px; font-size: 13.5px; }
  .pv-full h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .pv-full p { margin: 0; color: var(--ink-2); }
  .pv-full p.empty { color: var(--muted); font-style: italic; }
  .pv-full .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pv-full .roles { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .pv-full .roles li { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; }
  .pv-full .logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 1px solid var(--line); }
  .pv-full .t { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .pv-full .o { color: var(--muted); font-size: 12px; }
  .avail { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--ink); }
  .avail i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .avail.off { background: var(--chip); color: var(--muted); } .avail.off i { background: var(--muted); }
  .seg { display: none; }
  @media (max-width: 900px) {

/* ---------- Profile strength (shared by the directory and the editor) ---------- */
const RUBRIC = [
  { key: 'photo',      pts: 10, label: 'Add a photo',                          test: m => !!m.photo },
  { key: 'headline',   pts: 8,  label: 'Write a headline',                     test: m => (m.headline || '').trim().length >= 10 },

  { key: 'industries', pts: 6,  label: 'Choose your industries',               test: m => (m.industries || []).length > 0 },
  { key: 'stage',      pts: 6,  label: 'Say which stages you help best',       test: m => (m.stage || []).length > 0 },
  { key: 'helps',      pts: 6,  label: 'Choose how you like to help',          test: m => (m.helps || []).length > 0 },
  { key: 'invests',    pts: 4,  label: 'Answer whether you angel invest',      test: m => !!m.invests },
  { key: 'roles',      pts: 12, label: 'Add your last three roles',            test: m => filledRoles(m) >= 3, partial: m => Math.min(filledRoles(m), 2) * 4 },
  { key: 'notable',    pts: 6,  label: 'Add a notable line (an exit, a scale-up, a first)', test: m => !!(m.notable || '').trim() },
  { key: 'interests',  pts: 8,  label: "Share what you're interested in",      test: m => (m.interests || '').trim().length >= 20 },
  { key: 'linkedin',   pts: 6,  label: 'Add your LinkedIn URL',                test: m => /^https?:\/\/(www\.)?linkedin\.com\/in\/[^\s/]+\/?$/i.test(m.linkedin || '') },
];

  { min: 90, name: 'Founder-ready', blurb: 'Complete. Shown first in recommended order.' },
  { min: 70, name: 'Strong',        blurb: 'Nearly there — one or two additions away.' },
  { min: 40, name: 'Solid',         blurb: 'Founders can find you, but the profile is thin.' },

  let total = 0; const missing = [];
  for (const r of RUBRIC) {
    if (r.test(m)) { total += r.pts; continue; }

  return { id: m.id, first: m.first || '', last: m.last || '', headline: m.headline || '', location: m.location || '', linkedin: m.linkedin || '', bio: m.bio || '',
    skills: m.skills || [], industries: m.industries || [], stage: m.stage || [], helps: m.helps || [], available: (m.helps || []).some(h => /mentor/i.test(h)), invests: m.invests || '',
    investments: m.investments || '', notable: m.notable || '', interests: m.interests || '', photo: m.photo || '', photoNew: null, removePhoto: false, roles };
}
/* "2019–2023", "2021–present", "Jan 2019 - Mar 2023", "2020" → { from, to, current } and back */
function parseYears(d) {
  d = String(d || '').trim(); const ys = d.match(/\d{4}/g) || [];

}

  if (r.current) return f ? f + '–present' : 'present';
  if (f && t) return f + '–' + t;
  return f || t || '';
}

/* ---------- profile strength panel ---------- */
const FIELD_FOR = { photo: 'photoFile', headline: 'headline', location: 'location', bio: 'bio', skills: 'pickSkills', industries: 'pickInd', stage: 'pickStage', helps: 'pickHelps', invests: 'investments', roles: 'rolesEd', notable: 'notable', interests: 'interests', linkedin: 'linkedin' };
function scoreable(m) { return Object.assign({}, m, { photo: m.photoNew || (m.removePhoto ? '' : m.photo) }); }
function strengthPanel(m) {
  const s = score(scoreable(m));

  const toNext = s.next ? Math.round(((s.total - s.tier.min) / (s.next.min - s.tier.min)) * 100) : 100;
  const top = s.total >= 90;
  const next = s.missing[0];
  return `<div class="strength${top ? ' top' : ''}">
    <div class="sr">
      <svg class="ring" viewBox="0 0 96 96" role="img" aria-label="Profile strength ${s.total} out of 100"><circle class="bg" cx="48" cy="48" r="${r}"/><circle class="fg" cx="48" cy="48" r="${r}" transform="rotate(-90 48 48)" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/><text class="n" x="48" y="53">${s.total}</text><text class="d" x="48" y="67">out of 100</text></svg>
      <div><div class="tier">${s.tier.name}</div><div class="blurb">${s.tier.blurb}</div>
        ${s.next ? `<div class="to-next"><i style="width:${toNext}%"></i></div><div class="nxt">${s.next.min - s.total} points to ${s.next.name}</div>` : (s.missing.length ? `<div class="nxt">${100 - s.total} more point${100 - s.total === 1 ? '' : 's'} available</div>` : `<div class="nxt">Top tier — nothing left to add.</div>`)}</div>
    </div>
    ${next ? `<button class="next-step" type="button" data-jump="${FIELD_FOR[next.key]}"><span class="k">Next</span><span class="l">${esc(next.label)}</span><span class="g">+${next.gain}</span></button>` : ''}
    <ul class="todo">${RUBRIC.map(rr => { const done = rr.test(scoreable(m)); const miss = s.missing.find(x => x.key === rr.key); return `<li class="${done ? 'done' : ''}"><span class="bx">${done ? '✓' : ''}</span>${done ? esc(rr.label) : `<button type="button" data-jump="${FIELD_FOR[rr.key]}">${esc(rr.label)}</button>`}<span class="g">${done ? rr.pts : '+' + miss.gain}</span></li>`; }).join('')}</ul>
    <div class="why"><b>Why it matters:</b> founders filter by expertise, stage and sector, and the directory's recommended order puts Founder-ready, available profiles first.</div>
  </div>`;
}
function updateStrength() {

  const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Send back"><h2>Send back to ${esc(r.m.first)}</h2>
    <p style="margin:0;color:var(--muted);font-size:13px">${esc(r.m.first)} gets an email with your note and a link to sign in and fix it.${r.pub ? ' Their current live version stays on the members page in the meantime.' : ''}</p>
    <textarea id="sbTxt" aria-label="Note to the member" style="min-height:140px">Thanks for updating your profile — one thing before we publish it: </textarea>
    <div class="acts"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn cta" type="button" id="sbSend">Send back</button></div></div>`;
  document.body.appendChild(d);
  const close = () => d.remove();
  d.addEventListener('click', async e => {
    if (e.target === d || e.target.closest('[data-close]')) close();
    if (e.target.id === 'sbSend') { const note = $('#sbTxt').value.trim(); e.target.disabled = true; e.target.textContent = 'Sending…'; await setStatus(r.slug, 'draft', note); close(); }
  });
  document.addEventListener('keydown', function esc_(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc_); } });
  const t = $('#sbTxt'); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
}
function wireBoard() {
  $('#bq').addEventListener('input', e => { board.q = e.target.value.trim(); refreshBoardDom(); });
  $('#bTier').addEventListener('change', e => { board.tier = e.target.value; refreshBoardDom(); });
  $('#bStatus').addEventListener('change', e => { board.status = e.target.value; refreshBoardDom(); });
  $('#boardRoot').addEventListener('click', async e => {
    const s = e.target.closest('[data-sort]');
    if (s) { if (board.sort === s.dataset.sort) board.dir = board.dir === 'asc' ? 'desc' : 'asc'; else { board.sort = s.dataset.sort; board.dir = 'asc'; } render(); return; }
    const k = e.target.closest('[data-kpi]');
    if (k) {
      const v = k.dataset.kpi;
      if (v === 'queue') { jumpToQueue(null); return; }
      board.tier = v === 'all' ? 'all' : v; board.status = 'all'; $('#bTier').value = board.tier; $('#bStatus').value = 'all'; refreshBoardDom();
      $('.tablewrap').scrollIntoView({ behavior: 'smooth', block: 'start' }); return;
    }
    const rv = e.target.closest('[data-review]');
    if (rv) { board.open = board.open === rv.dataset.review ? null : rv.dataset.review; render(); const el = $('#q-' + CSS.escape(rv.dataset.review)); if (el && board.open) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const jp = e.target.closest('[data-jump]');
    if (jp) { jumpToQueue(jp.dataset.jump); return; }
    const sb = e.target.closest('[data-sendback]');
    if (sb) { const r = allRecords().find(x => x.slug === sb.dataset.sendback); if (r) openSendBack(r); return; }
    const nb = e.target.closest('[data-nudge]');
    if (nb) { const r = allRecords().find(x => x.slug === nb.dataset.nudge); openNudge([r]); return; }
    const st = e.target.closest('[data-status]');
    if (st) { await setStatus(st.dataset.id, st.dataset.status, '', st); return; }
    if (e.target.id === 'nudgeAll') { openNudge(allRecords().filter(r => r.score.total < 70)); return; }
    if (e.target.id === 'csv') { copyText(csv(), 'CSV copied — paste into a spreadsheet'); return; }
    if (e.target.id === 'refreshBoard') { await openBoard(); return; }
  });
}
async function openBoard() {
  view = 'busy'; render(); $('#loadMsg').textContent = 'Loading the board…';
  try { const j = await api({ action: 'board', session }); boardData = j.members || []; setTaxonomy(j.taxonomy); view = 'board'; render(); }
  catch (e) { toast(e.message, 5000); view = me ? 'editor' : 'signin'; render(); }
}
function nudgeText(r) {
  const s = r.score, top = s.missing.slice(0, 3).map(x => '  • ' + x.label + ' (+' + x.gain + ')').join('\n');
  return `Hi ${r.m.first},\n\nYour Tech Operators profile is at ${s.total}/100 (${s.tier.name}). Founders filter the members page by expertise, stage and sector, so a fuller profile means better-matched intros.\n\nThe quickest wins:\n${top}\n\nIt takes about five minutes — sign in at ${location.origin}/edit with this email address and the editor shows you exactly what's left.\n\nThanks,\nThe Tech Operators team`;
}
function openNudge(rows) {
  const text = rows.length === 1 ? nudgeText(rows[0]) : rows.map(r => `--- ${r.m.first} ${r.m.last} (${r.email}) ---\n${nudgeText(r)}`).join('\n\n');
  const d = document.createElement('div'); d.className = 'dlg';
  const mailto = rows.length === 1 && rows[0].email ? `mailto:${encodeURIComponent(rows[0].email)}?subject=${encodeURIComponent('Your Tech Operators profile')}&body=${encodeURIComponent(text)}` : '';
  d.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Nudge email"><h2>${rows.length === 1 ? `Nudge ${esc(rows[0].m.first)}` : `Nudge ${rows.length} members`}</h2>
    <p style="margin:0;color:var(--muted);font-size:13px">${rows.length === 1 ? 'Opens in your own email app so it comes from you, not from a bot.' : 'One draft per member — copy and send from your own email.'}</p>
    <textarea id="nudgeTxt" aria-label="Draft email">${esc(text)}</textarea>
    <div class="acts"><button class="btn ghost" type="button" data-close>Close</button><button class="btn ghost" type="button" id="nudgeCopy">Copy draft</button>${mailto ? `<a class="btn cta" href="${mailto}">Open in email</a>` : ''}</div></div>`;
  document.body.appendChild(d);
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.remove(); if (e.target.id === 'nudgeCopy') copyText($('#nudgeTxt').value, 'Draft copied'); });
  document.addEventListener('keydown', function esc_(e) { if (e.key === 'Escape') { d.remove(); document.removeEventListener('keydown', esc_); } });
  $('#nudgeTxt').focus();
}
function csv() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = ['Name', 'Email', 'Headline', 'Strength', 'Tier', 'Status', 'Updated', 'Missing', 'LinkedIn'];
  const rows = allRecords().sort((a, b) => a.score.total - b.score.total).map(r => [r.m.first + ' ' + r.m.last, r.email, r.m.headline, r.score.total, r.score.tier.name, r.meta.status, r.meta.updated ? new Date(r.meta.updated).toISOString() : '', r.score.missing.map(x => x.label).join('; '), r.m.linkedin]);
  return [head, ...rows].map(row => row.map(q).join(',')).join('\n');
}
function copyText(text, msg) {
  const done = () => toast(msg);
  try { navigator.clipboard.writeText(text).then(done, () => fallback()); } catch (e) { fallback(); }
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed — select the text and copy manually'); } ta.remove(); }
}

/* ---------- auth flow ---------- */
function signOut(expired) {
  session = null; me = null; isAdmin = false; boardData = [];
  try { sessionStorage.removeItem('to-session'); } catch (e) {}
  view = 'signin'; render();
  if (expired) { $('#app').innerHTML = signin('Your session has expired — request a new sign-in link.'); }
  window.scrollTo(0, 0);
}
async function openSession(token) {
  view = 'busy'; render();
  try {
    const j = await api({ action: 'session', token });
    session = j.session; try { sessionStorage.setItem('to-session', session); } catch (e) {}
    setTaxonomy(j.taxonomy); takeMember(j.member);
    view = isAdmin ? 'board' : 'editor';
    if (isAdmin) await openBoard(); else render();
  } catch (e) { session = null; view = 'signin'; render(); $('#app').innerHTML = signin(e.message); }
}
async function resumeSession(s) {
  view = 'busy'; render(); $('#loadMsg').textContent = 'Loading your profile…';
  try {
    session = s;
    const j = await api({ action: 'me', session });
    // taxonomy isn't returned by "me"; fetch it from the public directory endpoint
    try { const d = await fetch(API + '?action=directory', { credentials: 'omit' }).then(r => r.json()); setTaxonomy(d.taxonomy); } catch (e) {}
    takeMember(j.member);
    view = 'editor'; render();
  } catch (e) { signOut(false); }
}

document.addEventListener('submit', async e => {
  if (e.target.id !== 'signinForm') return;
  e.preventDefault();
  email = $('#email').value.trim().toLowerCase();
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  $('#emailErr').hidden = ok; if (!ok) { $('#email').focus(); return; }
  const btn = $('#sendBtn'); btn.disabled = true; btn.textContent = 'Sending…';
  try { await api({ action: 'requestLink', email }); resendAt = Date.now() + 60000; view = 'sent'; render(); }
  catch (err) { toast(err.message, 5000); btn.disabled = false; btn.textContent = 'Email me a sign-in link'; }
});
document.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { const t = tab.dataset.tab; if (t !== view) { if (view === 'editor' && dirty() && !confirm('You have unsaved changes. Leave without saving?')) return; if (t === 'board') await openBoard(); else { view = 'editor'; render(); } window.scrollTo(0, 0); } }
  if (e.target.id === 'resend') { if (Date.now() < resendAt) { toast('Give it a minute before requesting another link'); return; } try { await api({ action: 'requestLink', email }); resendAt = Date.now() + 60000; toast('Sign-in link sent again'); } catch (err) { toast(err.message, 5000); } }
  if (e.target.id === 'changeEmail') { view = 'signin'; render(); }
  if (e.target.id === 'signout') { if (view === 'editor' && dirty() && !confirm('You have unsaved changes. Sign out anyway?')) return; signOut(false); }
  if (e.target.id === 'saveDraft') save(false);
  if (e.target.id === 'submit') save(true);
});
window.addEventListener('beforeunload', e => { if (view === 'editor' && me && dirty()) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- boot ---------- */
function tokenFromHash() {
  const m = location.hash.match(/token=([^&]+)/);
  if (!m) return false;
  history.replaceState(null, '', location.pathname); openSession(decodeURIComponent(m[1])); return true;
}
window.addEventListener('hashchange', tokenFromHash);   // link opened into an already-open tab
(function boot() {
  if (tokenFromHash()) return;
  let s = null; try { s = sessionStorage.getItem('to-session'); } catch (e) {}
  if (s) { resumeSession(s); return; }
  render();
})();

</script>

</body>
